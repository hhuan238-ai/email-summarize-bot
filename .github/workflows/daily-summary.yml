name: Daily Email Summary

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily summary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_USER_EMAIL: ${{ secrets.GMAIL_USER_EMAIL }}
          SUMMARY_RECIPIENT_EMAIL: ${{ secrets.SUMMARY_RECIPIENT_EMAIL }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Los_Angeles' }}
          RUN_AFTER_HOUR_LOCAL: "0"
          RUN_BEFORE_HOUR_LOCAL: "6"
          SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL || 'gemini-2.0-flash' }}
          MAX_EMAILS: ${{ vars.MAX_EMAILS || '500' }}
        run: python email_summarize_bot.py
